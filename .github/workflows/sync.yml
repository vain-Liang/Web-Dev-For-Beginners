name: Sync and Clean from Upstream

on:
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'vain-Liang/Web-Dev-For-Beginners'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo
          
      - name: Checkout current zh repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/microsoft/Web-Dev-For-Beginners.git
          git fetch upstream

      - name: Sync from upstream
        run: |
          # Attempt to merge. If conflicts arise, let it fail and stop so that manual resolution can be performed.
          git merge upstream/main --allow-unrelated-histories --no-commit || true
          
          # Check for conflicts
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then

            # Keep local file versions
            git checkout --ours package.json README.md index.html ./docs/_navbar.md ./translations/zh/README.md ./translations/zh/docs/_sidebar.md ./translations/zh/docs/_navbar.md
            git add package.json README.md index.html ./docs/_navbar.md ./translations/zh/README.md ./translations/zh/docs/_sidebar.md ./translations/zh/docs/_navbar.md

            # Accept upstream version and resolve conflicts
            git checkout --theirs .
            git add .

            # Remove useless workflow conf
            git rm -f .github/workflows/azure-static-web-apps-ashy-river-0debb7803.yml
            git rm -f .github/workflows/co-op-translator.yml
            git rm -f .github/workflows/links.yml
            git rm -f .github/workflows/lock.yml
            git rm -f .github/workflows/stale.yml

            # Remove github template file
            git rm -r -f .github/ISSUE_TEMPLATE
            git rm -f .github/pull_request_template.md
            
            # Complete merge and commit
            git commit -m "Sync from upstream with automatic conflict resolution"
            
          else
            git commit -m "Sync from upstream"
          fi

      - name: Filter repository content
        run: |
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          
          # Run git-filter-repo with improved error handling
          git filter-repo --force --filename-callback '
          if filename.startswith(b"translations/") and not filename.startswith(b"translations/zh/"):
              return None
          if filename.startswith(b"translated_images/") and not filename.endswith(b".zh.png"):
              return None
          return filename
          '
          
          # Re-add the origin remote
          git remote add origin "${REMOTE_URL}"

      - name: Clean up history
        run: |
          git reflog expire --expire=now --all
          git gc --prune=now --aggressive

      - name: Push cleaned repo
        run: |
          git push origin main --force
